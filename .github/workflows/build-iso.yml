# 安装器 ISO：把已经构建好的固件包成一个可引导安装的 ISO（wukongdaily/img-installer）。
# 引导的是 Debian Live，跑码后输 ddd 出安装菜单，可选目标硬盘，装完有剩余空间。
#
# 【v.108.38 重写】原来这套 workflow 自己又跑一遍 imagebuilder 来"顺带"出 ISO，问题有三：
#   1) 它不挂 custom/、不跑 shell/prepare-crowdsec-rootfs.sh —— 编出来的固件既没有
#      CrowdSec 容器镜像，用户在构建页填的 Router IP / 掩码 / 网关 / DNS 也一行都不生效；
#   2) profile 默认 1G，而内置 CrowdSec 容器需要 2G 以上，等于每次都撞同一堵墙；
#   3) 它与 Release 里发布的固件是两次独立编译，ISO 里的固件和发布件对不上，
#      用户拿 ISO 装完发现行为与 bin 包不同，无从判断哪个才是真的。
# 现在改成只做"打包"：直接取 build-x86-64-24.10.x.yml 已经在末尾上传的 firmware-img
# artifact（那个上传步本来就是为了给 ISO 用，之前一直没人消费）。固件只有一份，
# ISO 与 Release 必然同源。

name: Build 24.10.x ISO x86-64

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "源构建 run id（留空 = 自动取最近一次成功的 build-x86-64-24.10.x.yml）"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

# 同一 tag 下反复上传会互相覆盖成半成品，串行但不要取消进行中的
concurrency:
  group: iso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_installer_iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Resolve Source Run
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_RUN: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$IN_RUN" ]; then
            RUN_ID="$IN_RUN"
            echo "使用手工指定的源构建 run: $RUN_ID"
          else
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "build-x86-64-24.10.x.yml" --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "自动选中的源构建 run: ${RUN_ID:-<空>}"
          fi
          # 没有源构建就没有固件，宁可红着失败，也不要产出一个装不上东西的 ISO
          case "$RUN_ID" in
            ''|null)
              echo "::error::找不到可用的源构建：请先成功跑一次 build-x86-64-24.10.x.yml，或在 source_run_id 里手填 run id"
              exit 1
              ;;
          esac
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Firmware Artifact
        uses: actions/download-artifact@v7
        with:
          name: firmware-img
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Verify Firmware Package
        run: |
          set -euo pipefail
          ls -lh ./*.img.gz
          _n=0
          for _f in ./*.img.gz; do
            [ -f "$_f" ] || continue
            # 空包/半截包 autobuild 会照单全收，等烧进盘里才发现起不来
            [ -s "$_f" ] || { echo "::error::$_f 是空文件"; exit 1; }
            gzip -t "$_f" || { echo "::error::$_f gzip CRC 校验失败（下载被截断？）"; exit 1; }
            echo "OK: $_f"
            _n=$((_n + 1))
          done
          [ "$_n" -ge 1 ] || { echo "::error::artifact firmware-img 里没有任何 *.img.gz"; exit 1; }

      - name: Sync img-installer
        run: git clone --depth 1 https://github.com/wukongdaily/img-installer.git

      - name: Make ISO
        run: |
          set -euo pipefail
          chmod +x img-installer/custom.sh \
                   img-installer/supportFiles/custom/build.sh \
                   img-installer/autobuild/autobuild.sh
          firmware_file=$(ls ./*squashfs-combined-efi.img.gz | head -n1)
          echo "打包固件: $firmware_file"
          cd img-installer
          bash autobuild/autobuild.sh "../$(basename "$firmware_file")"
          ls -lh output/

      - name: Upload ISO To Release
        uses: softprops/action-gh-release@v3
        with:
          # 24.10 与 25.12 必须分开 tag：两版资产同名（custom-installer-x86_64.iso），
          # 共用一个 tag 就是后跑的把先跑的覆盖掉，用户永远只拿到最后那一次。
          tag_name: "Custom-Installer-x86_64-24.10-ISO"
          body_path: "${{ github.workspace }}/img-installer/autobuild/info.md"
          files: |
            img-installer/output/custom-installer-x86_64.iso
          token: "${{ secrets.GITHUB_TOKEN }}"
