<text x="1378" y="419" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅱ</text>
<text x="88" y="444" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">容器启动前的静态准备</text>
<text x="88" y="468" font-size="15" fill="#7b4fd0" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">ct_net · cgroup_mount · ct_bootlink · ct_resolv</text>
<text x="1444" y="444" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：NETBASE INSTALL</text>
<text x="1444" y="468" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">网卡 / cgroup / 开机链 / DNS</text>
<rect x="36" y="508" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#e67e22" stroke-width="2"/>
<text x="54" y="538" font-size="18" font-weight="700" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">04</text>
<text x="88" y="538" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">CAPIBLOCK</text>
<rect x="1312" y="520" width="132" height="26" rx="6" fill="#e67e22"/>
<text x="1378" y="539" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅳ</text>
<text x="88" y="564" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">屏蔽 CAPI（容器内 online_client 停用）</text>
<text x="88" y="588" font-size="15" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">capi_block</text>
<text x="1444" y="564" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：INSTALL PREP</text>
<text x="1444" y="588" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">config.yaml 只在启动时读一次</text>
<rect x="36" y="628" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#e67e22" stroke-width="2"/>
<text x="54" y="658" font-size="18" font-weight="700" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">05</text>
<text x="88" y="658" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">BOOT</text>
<rect x="1312" y="640" width="132" height="26" rx="6" fill="#e67e22"/>
<text x="1378" y="659" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅳ</text>
<text x="88" y="684" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">启动容器（全程唯一一次开机）</text>
<text x="88" y="708" font-size="15" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">ct_boot</text>
<text x="1444" y="684" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：NETBASE PREP INSTALL CAPIBLOCK</text>
<text x="1444" y="708" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">没有 SNAT 不启动</text>
<rect x="36" y="748" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#e67e22" stroke-width="2"/>
<text x="54" y="778" font-size="18" font-weight="700" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">06</text>
<text x="88" y="778" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">LOGCONF</text>
<rect x="1312" y="760" width="132" height="26" rx="6" fill="#e67e22"/>
<text x="1378" y="779" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅳ</text>
<text x="88" y="804" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">日志链路与对外监听</text>
<text x="88" y="828" font-size="15" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">logconf</text>
<text x="1444" y="804" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：BOOT</text>
<text x="1444" y="828" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">宿主机推送 + 容器采集</text>
<rect x="36" y="868" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#e67e22" stroke-width="2"/>
<text x="54" y="898" font-size="18" font-weight="700" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">07</text>
<text x="88" y="898" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">LAPI</text>
<rect x="1312" y="880" width="132" height="26" rx="6" fill="#e67e22"/>
<text x="1378" y="899" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅳ</text>
<text x="88" y="924" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">取 LAPI 并填入路由器 bouncer</text>
<text x="88" y="948" font-size="15" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">lapi_fetch · bouncer_fill</text>
<text x="1444" y="924" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：BOOT</text>
<text x="1444" y="948" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">填完 api_url/key 重启 bouncer</text>
<rect x="36" y="988" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#e67e22" stroke-width="2"/>
<text x="54" y="1018" font-size="18" font-weight="700" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">08</text>
<text x="88" y="1018" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">BOUNCERVERIFY</text>
<rect x="1312" y="1000" width="132" height="26" rx="6" fill="#e67e22"/>
<text x="1378" y="1019" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅳ</text>
<text x="88" y="1044" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">验证 bouncer 真在拉，再解开 CAPI</text>
<text x="88" y="1068" font-size="15" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">bouncer_verify · capi_release</text>
<text x="1444" y="1044" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：LOGCONF LAPI</text>
<text x="1444" y="1068" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">看 last_pull 新鲜度</text>
<rect x="36" y="1108" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#e67e22" stroke-width="2"/>
<text x="54" y="1138" font-size="18" font-weight="700" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">09</text>
<text x="88" y="1138" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">DEPS</text>
