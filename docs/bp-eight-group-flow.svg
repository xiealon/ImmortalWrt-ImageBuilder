<text x="76" y="498" text-anchor="middle" font-weight="700" font-size="16" fill="#ffffff" font-family="sans-serif">2</text>
<text x="102" y="498" class="g" fill="#2b6cb0">INSTALL</text>
<text x="102" y="520" class="gt">安装容器（校验镜像完整性 / 解压 rootfs / 校验 config）</text>
<text x="1342" y="492" text-anchor="end" class="lb" fill="#2b6cb0">3 个小步骤</text>
<text x="1342" y="512" text-anchor="end" class="sm">前置：（无，独立入口）</text>
<rect x="102" y="536" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="111" y="552" class="n">img_migrate</text>
<rect x="310" y="536" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="319" y="552" class="n">rootfs</text>
<rect x="518" y="536" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="527" y="552" class="n">ct_config</text>
<text x="102" y="582" class="lb" fill="#2b6cb0">全通 → GSET_install=1</text>
<text x="102" y="601" class="ts">全部会真修 · img_migrate 不只查文件在，还要 gzip -t 过完整性</text>
<path d="M 700 612 L 700 626" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="630" width="1320" height="148" rx="8" fill="#ffffff" stroke="#b7791f" stroke-width="1.6"/>
<rect x="40" y="630" width="6" height="148" rx="3" fill="#b7791f"/>
<circle cx="76" cy="658" r="16" fill="#b7791f"/>
<text x="76" y="664" text-anchor="middle" font-weight="700" font-size="16" fill="#ffffff" font-family="sans-serif">3</text>
<text x="102" y="664" class="g" fill="#b7791f">CAPIBLOCK</text>
<text x="102" y="686" class="gt">屏蔽 CAPI（容器内 online_client 停用）</text>
<text x="1342" y="658" text-anchor="end" class="lb" fill="#b7791f">1 个小步骤</text>
<text x="1342" y="678" text-anchor="end" class="sm">前置：INSTALL PREP</text>
<rect x="102" y="702" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="111" y="718" class="n">capi_block</text>
<text x="102" y="748" class="lb" fill="#b7791f">全通 → GSET_capiblock=1</text>
<text x="102" y="767" class="ts">会真修 · 必须在 BOOT 之前：config.yaml 是开机读一次的</text>
<path d="M 700 778 L 700 792" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="796" width="1320" height="148" rx="8" fill="#ffffff" stroke="#6b46c1" stroke-width="1.6"/>
<rect x="40" y="796" width="6" height="148" rx="3" fill="#6b46c1"/>
<circle cx="76" cy="824" r="16" fill="#6b46c1"/>
<text x="76" y="830" text-anchor="middle" font-weight="700" font-size="16" fill="#ffffff" font-family="sans-serif">4</text>
<text x="102" y="830" class="g" fill="#6b46c1">BOOT</text>
<text x="102" y="852" class="gt">启动容器（全程唯一一次开机）</text>
<text x="1342" y="824" text-anchor="end" class="lb" fill="#6b46c1">1 个小步骤</text>
<text x="1342" y="844" text-anchor="end" class="sm">前置：PREP INSTALL CAPIBLOCK</text>
<rect x="102" y="868" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="111" y="884" class="n">ct_boot</text>
<text x="102" y="914" class="lb" fill="#6b46c1">全通 → GSET_boot=1</text>
<text x="102" y="933" class="ts">会真修 · 依赖含 snat：没 SNAT 就不开机（开了也是出不去的容器）</text>
<path d="M 700 944 L 700 958" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="962" width="1320" height="148" rx="8" fill="#ffffff" stroke="#c05621" stroke-width="1.6"/>
<rect x="40" y="962" width="6" height="148" rx="3" fill="#c05621"/>
<circle cx="76" cy="990" r="16" fill="#c05621"/>
<text x="76" y="996" text-anchor="middle" font-weight="700" font-size="16" fill="#ffffff" font-family="sans-serif">5</text>
<text x="102" y="996" class="g" fill="#c05621">LOGCONF</text>
<text x="102" y="1018" class="gt">日志与解析器（宿主机推送 + 容器内采集解析）</text>
<text x="1342" y="990" text-anchor="end" class="lb" fill="#c05621">2 个小步骤</text>
<text x="1342" y="1010" text-anchor="end" class="sm">前置：BOOT</text>
<rect x="102" y="1034" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="111" y="1050" class="n">acquis</text>
<rect x="310" y="1034" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="319" y="1050" class="n">log_forward</text>
<text x="102" y="1080" class="lb" fill="#c05621">全通 → GSET_logconf=1</text>
<text x="102" y="1099" class="ts">会真修 · acquis 查内容级：5 个顶层键 / 3 处 failed-auth / 2 处 auth_success</text>
<path d="M 700 1110 L 700 1124" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="1128" width="1320" height="148" rx="8" fill="#ffffff" stroke="#2c7a7b" stroke-width="1.6"/>
<rect x="40" y="1128" width="6" height="148" rx="3" fill="#2c7a7b"/>
<circle cx="76" cy="1156" r="16" fill="#2c7a7b"/>
<text x="76" y="1162" text-anchor="middle" font-weight="700" font-size="16" fill="#ffffff" font-family="sans-serif">6</text>
<text x="102" y="1162" class="g" fill="#2c7a7b">LAPI</text>
<text x="102" y="1184" class="gt">取 LAPI 地址并填入路由器 bouncer</text>
<text x="1342" y="1156" text-anchor="end" class="lb" fill="#2c7a7b">2 个小步骤</text>
<text x="1342" y="1176" text-anchor="end" class="sm">前置：BOOT</text>
<rect x="102" y="1200" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="111" y="1216" class="n">lapi_fetch</text>
<rect x="310" y="1200" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="319" y="1216" class="n">bouncer_fill</text>
<text x="102" y="1246" class="lb" fill="#2c7a7b">全通 → GSET_lapi=1</text>
<text x="102" y="1265" class="ts">会真修 · 填 api_url/api_key 后重启宿主机 bouncer（详见 lapi-group-flow 细部图）</text>
<path d="M 700 1276 L 700 1290" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="1294" width="1320" height="148" rx="8" fill="#ffffff" stroke="#9c4221" stroke-width="1.6"/>
<rect x="40" y="1294" width="6" height="148" rx="3" fill="#9c4221"/>
<circle cx="76" cy="1322" r="16" fill="#9c4221"/>
<text x="76" y="1328" text-anchor="middle" font-weight="700" font-size="16" fill="#ffffff" font-family="sans-serif">7</text>
<text x="102" y="1328" class="g" fill="#9c4221">BOUNCERVERIFY</text>
<text x="102" y="1350" class="gt">验证 bouncer 真在拉，再解开 CAPI</text>
<text x="1342" y="1322" text-anchor="end" class="lb" fill="#9c4221">2 个小步骤</text>
<text x="1342" y="1342" text-anchor="end" class="sm">前置：LOGCONF LAPI</text>
<rect x="102" y="1366" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="111" y="1382" class="n">bouncer_verify</text>
<rect x="310" y="1366" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="319" y="1382" class="n">capi_release</text>
<text x="102" y="1412" class="lb" fill="#9c4221">全通 → GSET_bouncerverify=1</text>
<text x="102" y="1431" class="ts">会真修 · 「注册过」≠「真的在拉」：看 last_pull 新鲜度（600s）</text>
<path d="M 700 1442 L 700 1456" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="1460" width="1320" height="148" rx="8" fill="#ffffff" stroke="#285e61" stroke-width="1.6"/>
<rect x="40" y="1460" width="6" height="148" rx="3" fill="#285e61"/>
<circle cx="76" cy="1488" r="16" fill="#285e61"/>
<text x="76" y="1494" text-anchor="middle" font-weight="700" font-size="16" fill="#ffffff" font-family="sans-serif">8</text>
<text x="102" y="1494" class="g" fill="#285e61">ENROLL</text>
<text x="102" y="1516" class="gt">Console Enroll（注册码文件缺失即视为就绪，直接通过）</text>
<text x="1342" y="1488" text-anchor="end" class="lb" fill="#285e61">0 个小步骤</text>
<text x="1342" y="1508" text-anchor="end" class="sm">前置：BOUNCERVERIFY</text>
<rect x="102" y="1532" width="1180" height="23" rx="4" fill="#f0fff4" stroke="#c6f6d5" stroke-dasharray="4 3"/>
<text x="111" y="1548" class="sm" fill="#276749">（ENROLL_NODES 为空：不排小步骤，动作由组自身 verify / build 承担）</text>
<text x="102" y="1578" class="lb" fill="#285e61">全通 → GSET_enroll=1</text>
<text x="102" y="1597" class="ts">无独立小步骤 · 动作在 verify_ENROLL / build_ENROLL 里 · re_enroll 前会先 rebuild snat</text>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#a0aec0"/>
  </marker>
</defs>
<rect x="40" y="1632" width="650" height="142" rx="7" fill="#f0fff4" stroke="#38a169"/>
<text x="58" y="1656" class="lb" fill="#276749">单步范式（两套语义，别混）</text>
<text x="58" y="1678" class="lg">ensure（开机 DAG 用）：verify 通过 → 跳过；否则 build → <tspan font-weight="600">再复核一次</tspan></text>
<text x="58" y="1699" class="lg">　　build 失败 或 复核仍不符 → hard 失败，exit 1</text>
<text x="58" y="1721" class="lg">rg_step（重启态服务链用）：verify 通过 → 跳过；否则修复一次 → 复核</text>
<text x="58" y="1742" class="lg">　　复核不过 → hard 失败，引导终止</text>
<text x="58" y="1764" class="ts" fill="#c53030">v.95/v.97：18 个节点全部「验证 + 修改」，RO_ONLY_NODES 已清空，没有只验不写的了</text>
<rect x="708" y="1632" width="652" height="142" rx="7" fill="#fffaf0" stroke="#dd6b20"/>
<text x="726" y="1656" class="lb" fill="#9c4221">失败分支与重装自愈</text>
<text x="726" y="1678" class="lg">小步骤 build 失败 → hard，引导终止</text>
<text x="726" y="1699" class="lg">重启态按组复验：缺哪个补哪个，补不上就彻底重装</text>
<text x="726" y="1721" class="lg">彻底重装 = 强停容器 → 抹 rootfs → 重新解压 → 自执行</text>
<text x="726" y="1742" class="ts" fill="#9c4200">五道门（任一不过即放弃重装）：</text>
<text x="726" y="1764" class="ts" fill="#9c4200">last_pull 已恢复 / 无 installed 标记 / 失败计数满 2 次 / 本次已是重装 / 镜像 gzip -t 不过</text>
<rect x="40" y="1790" width="650" height="150" rx="7" fill="#ebf8ff" stroke="#3182ce"/>
<text x="58" y="1814" class="lb" fill="#2c5282">脚本真正会写的东西（写完必 commit + 分组 reload）</text>
<text x="58" y="1836" class="ts" fill="#2c5282">network：bridge ports / lan 静态地址 / 删 wan+wan6 段 → network reload</text>
<text x="58" y="1856" class="ts" fill="#2c5282">dhcp：lan.ignore / time.android.com 的 domain 段 → dnsmasq restart</text>
<text x="58" y="1876" class="ts" fill="#2c5282">firewall：lxc zone+3 条 forwarding / wan·lan input / SNAT / docker → firewall reload</text>
<text x="58" y="1896" class="ts" fill="#2c5282">dropbear·ttyd 绑定接口 / system 的 log_ip / crowdsec 的 api_url·api_key</text>
<text x="58" y="1918" class="ts" fill="#c53030">reload 失败只记日志不 hard（已落盘）；改完复核不过一定 hard，不设回滚</text>
<text x="58" y="1938" class="ts" fill="#c53030">改 br-lan / lan 地址前先判 SSH 来源：可能失联就明确警告（不拦截）</text>
<rect x="708" y="1790" width="652" height="120" rx="7" fill="#fff5f5" stroke="#e53e3e"/>
<text x="726" y="1814" class="lb" fill="#9b2c2c">旁路由专属语义（本仓锁定，无模式开关）</text>
<text x="726" y="1836" class="lg">所有物理网口 → br-lan；WAN 段整段删除（不是 disabled=1）</text>
<text x="726" y="1857" class="lg">lan.ignore=1（不跑 DHCP）；出口经上游网关，本机不拨号</text>
<text x="726" y="1878" class="ts" fill="#c53030">为什么必须删：fw4（nft）不认 disabled，段还在就仍会起接口、挂 WAN zone</text>
<text x="726" y="1900" class="ts" fill="#c53030">SNAT 是容器出网生命线：缺它上游不认识容器网段，包直接被丢</text>
</svg>