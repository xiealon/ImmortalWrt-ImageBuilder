<text x="1378" y="1279" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅳ</text>
<text x="88" y="1304" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">只验不装：网络通不通 / 组件就位没</text>
<text x="88" y="1328" font-size="15" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">deps</text>
<text x="1444" y="1304" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：BOUNCERVERIFY</text>
<text x="1444" y="1328" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">未就绪则 enroll 跳过</text>
<rect x="36" y="1368" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#2e7d32" stroke-width="2"/>
<text x="54" y="1398" font-size="18" font-weight="700" fill="#2e7d32" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">10</text>
<text x="88" y="1398" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">SMARTCHK</text>
<rect x="1312" y="1380" width="132" height="26" rx="6" fill="#2e7d32"/>
<text x="1378" y="1399" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅴ</text>
<text x="88" y="1424" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">smartdns 运行态验证</text>
<text x="88" y="1448" font-size="15" fill="#2e7d32" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">sd_serve</text>
<text x="1444" y="1424" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：DEPS</text>
<text x="1444" y="1448" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">进程 / 53 监听 / 容器内解析</text>
<rect x="36" y="1488" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#2e7d32" stroke-width="2"/>
<text x="54" y="1518" font-size="18" font-weight="700" fill="#2e7d32" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">11</text>
<text x="88" y="1518" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">ENROLL</text>
<rect x="1312" y="1500" width="132" height="26" rx="6" fill="#2e7d32"/>
<text x="1378" y="1519" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅴ</text>
<text x="88" y="1544" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Console Enroll —— 全程唯一联网点</text>
<text x="88" y="1568" font-size="15" fill="#2e7d32" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">enroll</text>
<text x="1444" y="1544" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：SMARTCHK</text>
<text x="1444" y="1568" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">主码缺失用本地保险柜</text>
<line x1="36" y1="1616" x2="1464" y2="1616" stroke="#dddddd" stroke-width="1"/>
<text x="36" y="1644" font-size="15" fill="#444444" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">组顺序由 GROUP_SEQ 决定，不看书写顺序；组内节点由 DEP_* 拓扑排序。</text>
<text x="36" y="1668" font-size="15" fill="#444444" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">联网只出现在 ENROLL 一处；其余全部走 /rom 本地自愈。</text>
