<svg width="1020" height="1080" viewBox="0 0 1020 1080" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    .t{font-size:19px;font-weight:700;fill:#1a202c}
    .ts{font-size:11.5px;fill:#718096}
    .b{font-size:12px;font-weight:600;fill:#1a202c}
    .s{font-size:10px;fill:#4a5568}
    .mono{font-family:ui-monospace,'SFMono-Regular',Consolas,monospace}
