<text x="1378" y="559" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅱ</text>
<text x="88" y="584" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">容器启动前的静态准备</text>
<text x="88" y="608" font-size="15" fill="#7b4fd0" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">ct_net · cgroup_mount · ct_bootlink · ct_resolv</text>
<text x="1444" y="584" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：NETBASE INSTALL</text>
<text x="1444" y="608" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">网卡 / cgroup / 开机链 / DNS</text>
<rect x="36" y="648" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#e67e22" stroke-width="2"/>
<text x="54" y="678" font-size="18" font-weight="700" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">04</text>
<text x="88" y="678" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">CAPIBLOCK</text>
<rect x="1312" y="660" width="132" height="26" rx="6" fill="#e67e22"/>
<text x="1378" y="679" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅳ</text>
<text x="88" y="704" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">屏蔽 CAPI（容器内 online_client 停用）</text>
<text x="88" y="728" font-size="15" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">capi_block</text>
<text x="1444" y="704" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：INSTALL PREP</text>
<text x="1444" y="728" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">config.yaml 只在启动时读一次</text>
<rect x="36" y="768" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#e67e22" stroke-width="2"/>
<text x="54" y="798" font-size="18" font-weight="700" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">05</text>
<text x="88" y="798" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">BOOT</text>
<rect x="1312" y="780" width="132" height="26" rx="6" fill="#e67e22"/>
<text x="1378" y="799" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅳ</text>
<text x="88" y="824" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">启动容器（全程唯一一次开机）</text>
<text x="88" y="848" font-size="15" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">ct_boot</text>
<text x="1444" y="824" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：NETBASE PREP INSTALL CAPIBLOCK</text>
<text x="1444" y="848" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">没有 SNAT 不启动</text>
<rect x="36" y="888" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#e67e22" stroke-width="2"/>
<text x="54" y="918" font-size="18" font-weight="700" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">06</text>
<text x="88" y="918" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">LOGCONF</text>
<rect x="1312" y="900" width="132" height="26" rx="6" fill="#e67e22"/>
<text x="1378" y="919" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅳ</text>
<text x="88" y="944" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">日志链路与对外监听</text>
<text x="88" y="968" font-size="15" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">logconf</text>
<text x="1444" y="944" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：BOOT</text>
<text x="1444" y="968" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">宿主机推送 + 容器采集</text>
<rect x="36" y="1008" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#e67e22" stroke-width="2"/>
<text x="54" y="1038" font-size="18" font-weight="700" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">07</text>
<text x="88" y="1038" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">LAPI</text>
<rect x="1312" y="1020" width="132" height="26" rx="6" fill="#e67e22"/>
<text x="1378" y="1039" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅳ</text>
<text x="88" y="1064" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">取 LAPI 并填入路由器 bouncer</text>
<text x="88" y="1088" font-size="15" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">lapi_fetch · bouncer_fill</text>
<text x="1444" y="1064" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：BOOT</text>
<text x="1444" y="1088" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">填完 api_url/key 重启 bouncer</text>
<rect x="36" y="1128" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#e67e22" stroke-width="2"/>
<text x="54" y="1158" font-size="18" font-weight="700" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">08</text>
<text x="88" y="1158" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">BOUNCERVERIFY</text>
<rect x="1312" y="1140" width="132" height="26" rx="6" fill="#e67e22"/>
<text x="1378" y="1159" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅳ</text>
<text x="88" y="1184" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">验证 bouncer 真在拉，再解开 CAPI</text>
<text x="88" y="1208" font-size="15" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">bouncer_verify · capi_release</text>
<text x="1444" y="1184" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：LOGCONF LAPI</text>
<text x="1444" y="1208" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">看 last_pull 新鲜度</text>
<rect x="36" y="1248" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#e67e22" stroke-width="2"/>
<text x="54" y="1278" font-size="18" font-weight="700" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">09</text>
<text x="88" y="1278" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">DEPS</text>
