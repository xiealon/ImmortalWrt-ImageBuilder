<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="780" viewBox="0 0 1000 780">
<style>
.side{font-family:"Noto Sans CJK SC","Noto Serif CJK SC",sans-serif;font-size:13px;font-weight:700;letter-spacing:2px}
.t{font-family:"Noto Sans CJK SC","Noto Serif CJK SC",sans-serif;font-size:15px;font-weight:700}
.s{font-family:"Noto Sans CJK SC","Noto Serif CJK SC",sans-serif;font-size:12px}
.n{font-family:"Noto Sans CJK SC","Noto Serif CJK SC",sans-serif;font-size:11px;fill:#6b7280}
</style>
<rect width="1000" height="780" fill="#ffffff"/>
<text x="500.0" y="38" text-anchor="middle" class="t" font-size="19">ImmortalWrt-ImageBuilder-24.10 整体流程</text>
<text x="500.0" y="60" text-anchor="middle" class="n">编译期产出固件 · 运行期固件自举容器</text>
<rect x="26" y="74" width="428" height="4" rx="2" fill="#2563eb"/>
<text x="26" y="70" class="side" fill="#2563eb">编译期 · GitHub Actions</text>
<rect x="526" y="74" width="428" height="4" rx="2" fill="#059669"/>
<text x="526" y="70" class="side" fill="#059669">运行期 · 路由器开机</text>
<defs>
<marker id="ar_l" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#2563eb"/></marker>
<marker id="ar_r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#059669"/></marker>
</defs>
<rect x="40" y="92" width="400" height="68" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="66" cy="126.0" r="15" fill="#2563eb"/>
<text x="66" y="131.0" text-anchor="middle" class="s" fill="#ffffff" font-weight="700">1</text>
<text x="92" y="119" class="t" fill="#111827">手动 Run workflow</text>
<text x="92" y="140" class="s" fill="#4b5563">选 24.10.x 或 25.12.x，填 12 个输入</text>
<path d="M240.0 160 L240.0 176" stroke="#2563eb" stroke-width="2" marker-end="url(#ar_l)"/>
<rect x="40" y="184" width="400" height="68" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="66" cy="218.0" r="15" fill="#2563eb"/>
<text x="66" y="223.0" text-anchor="middle" class="s" fill="#ffffff" font-weight="700">2</text>
<text x="92" y="211" class="t" fill="#111827">参数校验</text>
<text x="92" y="232" class="s" fill="#4b5563">容器 IP / 网桥 IP / profile 合法性</text>
<path d="M240.0 252 L240.0 268" stroke="#2563eb" stroke-width="2" marker-end="url(#ar_l)"/>
<rect x="40" y="276" width="400" height="68" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="66" cy="310.0" r="15" fill="#2563eb"/>
<text x="66" y="315.0" text-anchor="middle" class="s" fill="#ffffff" font-weight="700">3</text>
<text x="92" y="303" class="t" fill="#111827">写入 custom/*.txt</text>
<text x="92" y="324" class="s" fill="#4b5563">路由 IP / 掩码 / 网关 / DNS / 容器 IP</text>
<path d="M240.0 344 L240.0 360" stroke="#2563eb" stroke-width="2" marker-end="url(#ar_l)"/>
<rect x="40" y="368" width="400" height="68" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="66" cy="402.0" r="15" fill="#2563eb"/>
<text x="66" y="407.0" text-anchor="middle" class="s" fill="#ffffff" font-weight="700">4</text>
<text x="92" y="395" class="t" fill="#111827">准备 CrowdSec rootfs</text>
<text x="92" y="416" class="s" fill="#4b5563">Ubuntu 22.04 base + apt 装 crowdsec</text>
<path d="M240.0 436 L240.0 452" stroke="#2563eb" stroke-width="2" marker-end="url(#ar_l)"/>
<rect x="40" y="460" width="400" height="68" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="66" cy="494.0" r="15" fill="#2563eb"/>
<text x="66" y="499.0" text-anchor="middle" class="s" fill="#ffffff" font-weight="700">5</text>
<text x="92" y="487" class="t" fill="#111827">Docker 里跑 build.sh</text>
<text x="92" y="508" class="s" fill="#4b5563">immortalwrt/imagebuilder 拉源码编镜像</text>
<path d="M240.0 528 L240.0 544" stroke="#2563eb" stroke-width="2" marker-end="url(#ar_l)"/>
<rect x="40" y="552" width="400" height="68" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<circle cx="66" cy="586.0" r="15" fill="#2563eb"/>
<text x="66" y="591.0" text-anchor="middle" class="s" fill="#ffffff" font-weight="700">6</text>
<text x="92" y="579" class="t" fill="#111827">发布 Release</text>
<text x="92" y="600" class="s" fill="#4b5563">tag Autobuild-x86-64 + img.gz 产物</text>
<rect x="540" y="92" width="400" height="68" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<circle cx="566" cy="126.0" r="15" fill="#059669"/>
<text x="566" y="131.0" text-anchor="middle" class="s" fill="#ffffff" font-weight="700">7</text>
<text x="592" y="119" class="t" fill="#111827">刷机开机 → rc.local</text>
<text x="592" y="140" class="s" fill="#4b5563">前置检查：脚本在、镜像/rootfs 在</text>
<path d="M740.0 160 L740.0 176" stroke="#059669" stroke-width="2" marker-end="url(#ar_r)"/>
<rect x="540" y="184" width="400" height="68" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<circle cx="566" cy="218.0" r="15" fill="#059669"/>
<text x="566" y="223.0" text-anchor="middle" class="s" fill="#ffffff" font-weight="700">8</text>
<text x="592" y="211" class="t" fill="#111827">抢引导锁</text>
<text x="592" y="232" class="s" fill="#4b5563">残留超 30 分钟强夺，防并发双跑</text>
<path d="M740.0 252 L740.0 268" stroke="#059669" stroke-width="2" marker-end="url(#ar_r)"/>
<rect x="540" y="276" width="400" height="68" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<circle cx="566" cy="310.0" r="15" fill="#059669"/>
<text x="566" y="315.0" text-anchor="middle" class="s" fill="#ffffff" font-weight="700">9</text>
<text x="592" y="303" class="t" fill="#111827">bootstrap 七大步骤</text>
<text x="592" y="324" class="s" fill="#4b5563">逐组验证→缺就建→全通才置位</text>
<path d="M740.0 344 L740.0 360" stroke="#059669" stroke-width="2" marker-end="url(#ar_r)"/>
<rect x="540" y="368" width="400" height="68" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<circle cx="566" cy="402.0" r="15" fill="#059669"/>
<text x="566" y="407.0" text-anchor="middle" class="s" fill="#ffffff" font-weight="700">10</text>
<text x="592" y="395" class="t" fill="#111827">INSTALL→NETWORK→BOOT</text>
<text x="592" y="416" class="s" fill="#4b5563">解压 rootfs / 验 LuCI 网络 / 起容器</text>
<path d="M740.0 436 L740.0 452" stroke="#059669" stroke-width="2" marker-end="url(#ar_r)"/>
<rect x="540" y="460" width="400" height="68" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<circle cx="566" cy="494.0" r="15" fill="#059669"/>
<text x="566" y="499.0" text-anchor="middle" class="s" fill="#ffffff" font-weight="700">11</text>
<text x="592" y="487" class="t" fill="#111827">CONFIGURE→BOUNCER</text>
<text x="592" y="508" class="s" fill="#4b5563">容器内日志解析器 / bouncer 注册联动</text>
<path d="M740.0 528 L740.0 544" stroke="#059669" stroke-width="2" marker-end="url(#ar_r)"/>
<rect x="540" y="552" width="400" height="68" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<circle cx="566" cy="586.0" r="15" fill="#059669"/>
<text x="566" y="591.0" text-anchor="middle" class="s" fill="#ffffff" font-weight="700">12</text>
<text x="592" y="579" class="t" fill="#111827">VERIFY→ENROLL</text>
<text x="592" y="600" class="s" fill="#4b5563">列表生效解 CAPI / Console 账号绑定</text>
<path d="M440 586.0 L484.0 586.0 L484.0 126.0 L534 126.0" fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ar_r)"/>
<text x="480.0" y="578.0" text-anchor="middle" class="n" fill="#6b7280">产物</text>
<text x="480.0" y="594.0" text-anchor="middle" class="n" fill="#6b7280">img.gz</text>
<text x="40" y="652" class="side" fill="#7c3aed">旁挂</text>
<rect x="40" y="664" width="920" height="44" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="56" y="683" class="t" font-size="13" fill="#6b21a8">probe 守护</text>
<text x="56" y="700" class="s" fill="#4b5563">每 60s 看 last_pull，停滞 3 轮触发 bootstrap，冷却 600s</text>
<rect x="40" y="718" width="920" height="44" rx="6" fill="#faf5ff" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="56" y="737" class="t" font-size="13" fill="#6b21a8">clean-workflow</text>
<text x="56" y="754" class="s" fill="#4b5563">手动清 N 天前的 Actions 运行记录</text>
</svg>