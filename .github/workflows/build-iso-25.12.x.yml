# 安装器 ISO（25.12.x / apk 线）：把已经构建好的固件包成可引导安装的 ISO。
#
# 【v.108.38 重写】与 24.10 版同样的原因重写：原来自己重编一遍固件，
# 但不跑 shell/prepare-crowdsec-rootfs.sh，profile 默认还是 1G，
# 编出来的固件没有 CrowdSec 容器，和 Release 里发布的不是同一个东西。
# 现在只做打包：取 build-x86-64-25.12.x.yml 末尾上传的 firmware-img artifact。

name: Build 25.12.x ISO x86-64

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "源构建 run id（留空 = 自动取最近一次成功的 build-x86-64-25.12.x.yml）"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: iso-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_installer_iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Resolve Source Run
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_RUN: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$IN_RUN" ]; then
            RUN_ID="$IN_RUN"
            echo "使用手工指定的源构建 run: $RUN_ID"
          else
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" \
              --workflow "build-x86-64-25.12.x.yml" --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId')
            echo "自动选中的源构建 run: ${RUN_ID:-<空>}"
          fi
          case "$RUN_ID" in
            ''|null)
              echo "::error::找不到可用的源构建：请先成功跑一次 build-x86-64-25.12.x.yml，或在 source_run_id 里手填 run id"
              exit 1
              ;;
          esac
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Firmware Artifact
        uses: actions/download-artifact@v7
        with:
          name: firmware-img
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Verify Firmware Package
        run: |
          set -euo pipefail
          ls -lh ./*.img.gz
          _n=0
          for _f in ./*.img.gz; do
            [ -f "$_f" ] || continue
            [ -s "$_f" ] || { echo "::error::$_f 是空文件"; exit 1; }
            gzip -t "$_f" || { echo "::error::$_f gzip CRC 校验失败（下载被截断？）"; exit 1; }
            echo "OK: $_f"
            _n=$((_n + 1))
          done
          [ "$_n" -ge 1 ] || { echo "::error::artifact firmware-img 里没有任何 *.img.gz"; exit 1; }

      - name: Sync img-installer
        run: git clone --depth 1 https://github.com/wukongdaily/img-installer.git

      - name: Make ISO
        run: |
          set -euo pipefail
          chmod +x img-installer/custom.sh \
                   img-installer/supportFiles/custom/build.sh \
                   img-installer/autobuild/autobuild.sh
          firmware_file=$(ls ./*squashfs-combined-efi.img.gz | head -n1)
          echo "打包固件: $firmware_file"
          cd img-installer
          bash autobuild/autobuild.sh "../$(basename "$firmware_file")"
          ls -lh output/

      - name: Upload ISO To Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "Custom-Installer-x86_64-25.12-ISO"
          body_path: "${{ github.workspace }}/img-installer/autobuild/info.md"
          files: |
            img-installer/output/custom-installer-x86_64.iso
          token: "${{ secrets.GITHUB_TOKEN }}"
