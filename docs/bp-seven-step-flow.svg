<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1560" viewBox="0 0 1240 1560">
<style>
  .t  { font: 600 21px "Noto Sans CJK SC",sans-serif; fill:#1a202c; }
  .ts { font: 400 12.5px "Noto Sans CJK SC",sans-serif; fill:#4a5568; }
  .g  { font: 700 15px "JetBrains Mono","Consolas",monospace; }
  .gt { font: 500 12px "Noto Sans CJK SC",sans-serif; fill:#2d3748; }
  .n  { font: 400 11px "JetBrains Mono","Consolas",monospace; fill:#2d3748; }
  .lg { font: 400 12px "Noto Sans CJK SC",sans-serif; fill:#2d3748; }
  .lb { font: 600 12px "Noto Sans CJK SC",sans-serif; }
</style>
<rect width="1240" height="1560" fill="#ffffff"/>
<text x="620" y="38" text-anchor="middle" class="t">旁路由版 · 七大步骤链式置位</text>
<text x="620" y="60" text-anchor="middle" class="ts">crowdsec-lxc-bootstrap.sh（旁路由版 · 2026-10-19.90-bp）· 每组先验前面所有组 GSET_* = 1 才执行，全通才置位</text>
<rect x="40" y="80" width="1160" height="54" rx="7" fill="#f7fafc" stroke="#cbd5e0"/>
<text x="60" y="102" class="lb" fill="#2b6cb0">执行门禁：</text>
<text x="60" y="122" class="lg">for gd in $GROUP_DEP_&lt;g&gt;：若 GSET_&lt;gd&gt; != 1 → 整组跳过，不置位（后续组连带跳过）</text>
<text x="700" y="102" class="lb" fill="#2f855a">置位条件：</text>
<text x="700" y="122" class="lg">组内 19→N 个小步骤全部通过 → GSET_&lt;g&gt;=1；任一失败 → 绝不置位</text>
<rect x="40" y="158" width="1160" height="150" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/>
<rect x="40" y="158" width="6" height="150" rx="3" fill="#2b6cb0"/>
<circle cx="74" cy="185" r="15" fill="#2b6cb0"/>
<text x="74" y="190" text-anchor="middle" font="700 15px sans-serif" fill="#ffffff">1</text>
<text x="98" y="191" class="g" fill="#2b6cb0">INSTALL</text>
<text x="98" y="212" class="gt">安装容器（含 CrowdSec）并验证安装</text>
<text x="1184" y="191" text-anchor="end" class="ts">3 个小步骤</text>
<rect x="98" y="230" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="106" y="246" class="n">img_migrate</text>
<rect x="276" y="230" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="284" y="246" class="n">rootfs</text>
<rect x="454" y="230" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="462" y="246" class="n">ct_config</text>
<text x="98" y="296" class="lb" fill="#2b6cb0">全通 → GSET_install=1</text>
<text x="340" y="296" class="ts">前置：（无，首组）</text>
<path d="M 620 308 L 620 322" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="630" y="319" class="ts">GSET 已置位？</text>
<rect x="40" y="326" width="1160" height="150" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.6"/>
<rect x="40" y="326" width="6" height="150" rx="3" fill="#2f855a"/>
<circle cx="74" cy="353" r="15" fill="#2f855a"/>
<text x="74" y="358" text-anchor="middle" font="700 15px sans-serif" fill="#ffffff">2</text>
<text x="98" y="359" class="g" fill="#2f855a">NETWORK</text>
<text x="98" y="380" class="gt">验证桥信息 / 容器网络 config / 系统日志推送</text>
<text x="1184" y="359" text-anchor="end" class="ts">12 个小步骤</text>
<rect x="98" y="398" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="106" y="414" class="n">br_lan_ports</text>
<rect x="276" y="398" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="284" y="414" class="n">lan_static</text>
<rect x="454" y="398" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="462" y="414" class="n">dhcp_ignore</text>
<rect x="632" y="398" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="640" y="414" class="n">wan_port</text>
<rect x="810" y="398" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="818" y="414" class="n">dns_domain</text>
<rect x="988" y="398" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="996" y="414" class="n">bridge</text>
<rect x="98" y="428" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="106" y="444" class="n">lxc_zone</text>
<rect x="276" y="428" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="284" y="444" class="n">fwd_rules</text>
<rect x="454" y="428" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="462" y="444" class="n">wan_input</text>
<rect x="632" y="428" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="640" y="444" class="n">lan_input</text>
<rect x="810" y="428" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="818" y="444" class="n">snat</text>
<rect x="988" y="428" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="996" y="444" class="n">ip_forward</text>
<text x="98" y="464" class="lb" fill="#2f855a">全通 → GSET_network=1</text>
<text x="340" y="464" class="ts">前置：INSTALL</text>
<path d="M 620 476 L 620 490" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="630" y="487" class="ts">GSET 已置位？</text>
<rect x="40" y="494" width="1160" height="150" rx="8" fill="#ffffff" stroke="#6b46c1" stroke-width="1.6"/>
<rect x="40" y="494" width="6" height="150" rx="3" fill="#6b46c1"/>
<circle cx="74" cy="521" r="15" fill="#6b46c1"/>
<text x="74" y="526" text-anchor="middle" font="700 15px sans-serif" fill="#ffffff">3</text>
<text x="98" y="527" class="g" fill="#6b46c1">BOOT</text>
<text x="98" y="548" class="gt">启动容器并验证 cgroup 挂载</text>
<text x="1184" y="527" text-anchor="end" class="ts">1 个小步骤</text>
<rect x="98" y="566" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="106" y="582" class="n">ct_boot</text>
<text x="98" y="632" class="lb" fill="#6b46c1">全通 → GSET_boot=1</text>
<text x="340" y="632" class="ts">前置：INSTALL + NETWORK</text>
<path d="M 620 644 L 620 658" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="630" y="655" class="ts">GSET 已置位？</text>
<rect x="40" y="662" width="1160" height="150" rx="8" fill="#ffffff" stroke="#b7791f" stroke-width="1.6"/>
<rect x="40" y="662" width="6" height="150" rx="3" fill="#b7791f"/>
<circle cx="74" cy="689" r="15" fill="#b7791f"/>
<text x="74" y="694" text-anchor="middle" font="700 15px sans-serif" fill="#ffffff">4</text>
<text x="98" y="695" class="g" fill="#b7791f">CONFIGURE</text>
<text x="98" y="716" class="gt">验证容器内日志 / 解析器 / 白名单 / 屏蔽 CAPI</text>
<text x="1184" y="695" text-anchor="end" class="ts">3 个小步骤</text>
<rect x="98" y="734" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="106" y="750" class="n">prepare_container</text>
<rect x="276" y="734" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="284" y="750" class="n">svc_bind</text>
<rect x="454" y="734" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="462" y="750" class="n">docker_fw</text>
<text x="98" y="800" class="lb" fill="#b7791f">全通 → GSET_configure=1</text>
<text x="340" y="800" class="ts">前置：INSTALL + NETWORK + BOOT</text>
<path d="M 620 812 L 620 826" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="630" y="823" class="ts">GSET 已置位？</text>
<rect x="40" y="830" width="1160" height="150" rx="8" fill="#ffffff" stroke="#c05621" stroke-width="1.6"/>
<rect x="40" y="830" width="6" height="150" rx="3" fill="#c05621"/>
<circle cx="74" cy="857" r="15" fill="#c05621"/>
<text x="74" y="862" text-anchor="middle" font="700 15px sans-serif" fill="#ffffff">5</text>
<text x="98" y="863" class="g" fill="#c05621">BOUNCER</text>
<text x="98" y="884" class="gt">获取 bouncer 并与路由器 bouncer 联动</text>
<text x="1184" y="863" text-anchor="end" class="ts">2 个小步骤</text>
<rect x="98" y="902" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="106" y="918" class="n">bouncer_ensure</text>
<rect x="276" y="902" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="284" y="918" class="n">bouncer_link</text>
<text x="98" y="968" class="lb" fill="#c05621">全通 → GSET_bouncer=1</text>
<text x="340" y="968" class="ts">前置：INSTALL + NETWORK + BOOT + CONFIGURE</text>
<path d="M 620 980 L 620 994" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="630" y="991" class="ts">GSET 已置位？</text>
<rect x="40" y="998" width="1160" height="150" rx="8" fill="#ffffff" stroke="#9c4221" stroke-width="1.6"/>
<rect x="40" y="998" width="6" height="150" rx="3" fill="#9c4221"/>
<circle cx="74" cy="1025" r="15" fill="#9c4221"/>
<text x="74" y="1030" text-anchor="middle" font="700 15px sans-serif" fill="#ffffff">6</text>
<text x="98" y="1031" class="g" fill="#9c4221">VERIFY</text>
<text x="98" y="1052" class="gt">验证 bouncer 列表生效并解开 CAPI</text>
<text x="1184" y="1031" text-anchor="end" class="ts">2 个小步骤</text>
<rect x="98" y="1070" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="106" y="1086" class="n">lapi_ready</text>
<rect x="276" y="1070" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="284" y="1086" class="n">bouncer_list</text>
<text x="98" y="1136" class="lb" fill="#9c4221">全通 → GSET_verify=1</text>
<text x="340" y="1136" class="ts">前置：INSTALL + NETWORK + BOOT + CONFIGURE + BOUNCER</text>
<path d="M 620 1148 L 620 1162" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="630" y="1159" class="ts">GSET 已置位？</text>
<rect x="40" y="1166" width="1160" height="150" rx="8" fill="#ffffff" stroke="#285e61" stroke-width="1.6"/>
<rect x="40" y="1166" width="6" height="150" rx="3" fill="#285e61"/>
<circle cx="74" cy="1193" r="15" fill="#285e61"/>
<text x="74" y="1198" text-anchor="middle" font="700 15px sans-serif" fill="#ffffff">7</text>
<text x="98" y="1199" class="g" fill="#285e61">ENROLL</text>
<text x="98" y="1220" class="gt">Console Enroll</text>
<text x="1184" y="1199" text-anchor="end" class="ts">1 个小步骤</text>
<rect x="98" y="1238" width="168" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="106" y="1254" class="n">console_enroll</text>
<text x="98" y="1304" class="lb" fill="#285e61">全通 → GSET_enroll=1</text>
<text x="340" y="1304" class="ts">前置：INSTALL + NETWORK + BOOT + CONFIGURE + BOUNCER + VERIFY</text>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0,0 L9,4.5 L0,9 z" fill="#a0aec0"/>
  </marker>
</defs>
<rect x="40" y="1340" width="565" height="118" rx="7" fill="#f0fff4" stroke="#38a169"/>
<text x="58" y="1364" class="lb" fill="#276749">单步范式（无复核）</text>
<text x="58" y="1386" class="lg">verify 内容一致 → 跳过，零构建</text>
<text x="58" y="1408" class="lg">verify 不符 → build 一次 → 直接返回</text>
<text x="58" y="1430" class="lg">build 返回非零 → hard 失败，exit 1</text>
<text x="58" y="1450" class="ts" fill="#c53030">关键：构建后不再复查，避免重启时重复构建</text>
<rect x="625" y="1340" width="575" height="118" rx="7" fill="#fffaf0" stroke="#dd6b20"/>
<text x="643" y="1364" class="lb" fill="#9c4221">失败分支</text>
<text x="643" y="1386" class="lg">小步骤 build 失败 → hard，引导终止</text>
<text x="643" y="1408" class="lg">重启时 rg_restart_verify 逐组复验</text>
<text x="643" y="1430" class="lg">不可修复 → full_reinstall 彻底重建容器</text>
<text x="643" y="1450" class="ts" fill="#9c4200">五道门：last_pull 恢复 / 无 stamp / 计数满 / 递归 / 镜像坏 → 全拒</text>
<rect x="40" y="1472" width="1160" height="74" rx="7" fill="#ebf8ff" stroke="#3182ce"/>
<text x="58" y="1496" class="lb" fill="#2c5282">旁路由专属语义（本仓锁定，无模式开关）</text>
<text x="58" y="1518" class="lg">所有物理网口 → br-lan；wan / wan6 一律 disabled=1（不抢上游拨号）；lan.ignore=1（不跑 DHCP 服务）</text>
<text x="58" y="1538" class="lg">不写 wan.proto、不设 wan.device —— 只禁用不重配，出口经上游网关</text>
</svg>