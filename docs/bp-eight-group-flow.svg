<rect width="1400" height="1944" fill="#ffffff"/>
<text x="700" y="38" text-anchor="middle" class="t">旁路由版 · 八组链式置位（大步骤 / 小步骤细分）</text>
<text x="700" y="60" text-anchor="middle" class="ts">crowdsec-lxc-bootstrap.sh · 2026-10-20.104-bp · 8 个组 / 29 个小步骤 · 每组先验前置组 GSET_*（非空）才执行，全通才置位</text>
<rect x="40" y="78" width="1320" height="58" rx="7" fill="#f7fafc" stroke="#cbd5e0"/>
<text x="58" y="100" class="lb" fill="#2b6cb0">执行门禁：</text>
<text x="58" y="120" class="lg">遍历 GROUP_DEP_&lt;g&gt;：任一前置组 GSET_&lt;gd&gt; != 1 → 整组不执行、不置位（下游连带跳过）</text>
<text x="740" y="100" class="lb" fill="#2f855a">置位条件：</text>
<text x="740" y="120" class="lg">组内小步骤全部通过 → GSET_&lt;g&gt;=1；任一未通过 → 绝不置位</text>
<rect x="40" y="152" width="1320" height="72" rx="7" fill="#faf5ff" stroke="#805ad5"/>
<text x="58" y="176" class="lb" fill="#553c9a">运行期探针 crowdsec-lxc-probe（init.d START=99）</text>
<text x="58" y="200" class="lg">每 60s 问 bootstrap --probe-check：无 installed 标记 → 静默等待 · 引导锁被占 → 本轮跳过 · 连续 3 轮停滞且过 600s 冷却 → 持同一把锁拉起 bootstrap</text>
<text x="1342" y="186" text-anchor="end" class="ts" fill="#c53030">只报不修 · 修复逻辑全部复用 bootstrap，永不同时跑两个</text>
<rect x="40" y="238" width="1320" height="208" rx="8" fill="#ffffff" stroke="#2f855a" stroke-width="1.6"/>
<rect x="40" y="238" width="6" height="208" rx="3" fill="#2f855a"/>
<circle cx="76" cy="266" r="16" fill="#2f855a"/>
<text x="76" y="272" text-anchor="middle" font-weight="700" font-size="16" fill="#ffffff" font-family="sans-serif">1</text>
<text x="102" y="272" class="g" fill="#2f855a">PREP</text>
<text x="102" y="294" class="gt">容器启动前的全部静态准备（路由器网桥 / 容器网络 / cgroup / 防火墙）</text>
<text x="1342" y="266" text-anchor="end" class="lb" fill="#2f855a">18 个小步骤</text>
<text x="1342" y="286" text-anchor="end" class="sm">前置：（无，独立入口）</text>
<rect x="102" y="310" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="111" y="326" class="n">br_lan_ports</text>
<rect x="310" y="310" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="319" y="326" class="n">lan_static</text>
<rect x="518" y="310" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="527" y="326" class="n">dhcp_ignore</text>
<rect x="726" y="310" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="735" y="326" class="n">wan_removed</text>
<rect x="934" y="310" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="943" y="326" class="n">dns_domain</text>
<rect x="1142" y="310" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="1151" y="326" class="n">bridge</text>
<rect x="102" y="340" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="111" y="356" class="n">ct_net</text>
<rect x="310" y="340" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="319" y="356" class="n">cgroup_mount</text>
<rect x="518" y="340" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="527" y="356" class="n">ct_bootlink</text>
<rect x="726" y="340" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="735" y="356" class="n">ct_resolv</text>
<rect x="934" y="340" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="943" y="356" class="n">lxc_zone</text>
<rect x="1142" y="340" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="1151" y="356" class="n">fwd_rules</text>
<rect x="102" y="370" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="111" y="386" class="n">wan_input</text>
<rect x="310" y="370" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="319" y="386" class="n">lan_input</text>
<rect x="518" y="370" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="527" y="386" class="n">snat</text>
<rect x="726" y="370" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="735" y="386" class="n">ip_forward</text>
<rect x="934" y="370" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="943" y="386" class="n">svc_bind</text>
<rect x="1142" y="370" width="196" height="23" rx="4" fill="#f7fafc" stroke="#e2e8f0"/>
<text x="1151" y="386" class="n">docker_fw</text>
<text x="102" y="416" class="lb" fill="#2f855a">全通 → GSET_prep=1</text>
<text x="102" y="435" class="ts">18 项全部会真修 · 写 network/dhcp/firewall 三面 + ip_forward，改完 commit + 分组 reload 即生效</text>
<path d="M 700 446 L 700 460" stroke="#a0aec0" stroke-width="1.6" marker-end="url(#ar)"/>
<rect x="40" y="464" width="1320" height="148" rx="8" fill="#ffffff" stroke="#2b6cb0" stroke-width="1.6"/>
