<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1564" viewBox="0 0 1500 1564">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="36" y="46" font-size="30" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">crowdsec-lxc-bootstrap.sh · 11 组 · 31 节点</text>
<text x="36" y="76" font-size="17" fill="#666666" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">v.180.113 · 组内每个节点都是「先验证现场，达标就零写入；不达标才构建」</text>
<rect x="36" y="88" width="24" height="16" fit="" fill="#2f6fd0"/>
<text x="66" y="102" font-size="15" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅰ 网络</text>
<rect x="156" y="88" width="24" height="16" fit="" fill="#7b4fd0"/>
<text x="186" y="102" font-size="15" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅱ 容器</text>
<rect x="276" y="88" width="24" height="16" fit="" fill="#0e8a8a"/>
<text x="306" y="102" font-size="15" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅲ smartdns</text>
<rect x="492" y="88" width="24" height="16" fit="" fill="#e67e22"/>
<text x="522" y="102" font-size="15" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅳ crowdsec</text>
<rect x="708" y="88" width="24" height="16" fit="" fill="#2e7d32"/>
<text x="738" y="102" font-size="15" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅴ 检测+注册</text>
<rect x="36" y="118" width="1428" height="136" rx="10" fill="#fbfcff" stroke="#2f6fd0" stroke-width="2"/>
<text x="54" y="148" font-size="18" font-weight="700" fill="#2f6fd0" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">01</text>
<text x="88" y="148" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">NETBASE</text>
<rect x="1312" y="130" width="132" height="26" rx="6" fill="#2f6fd0"/>
<text x="1378" y="149" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅰ Ⅱ Ⅲ</text>
<text x="88" y="174" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">网络基线 → 从 /rom 补包 → smartdns 配置</text>
<text x="88" y="198" font-size="15" fill="#2f6fd0" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">br_lan_ports · lan_static · dhcp_ignore · bridge · lxc_zone · fwd_rules</text>
<text x="88" y="219" font-size="15" fill="#2f6fd0" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">lan_input · snat · ip_forward · svc_bind · docker_fw</text>
<text x="88" y="240" font-size="15" fill="#2f6fd0" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">（Ⅱ）pkg_base · lxc_auto · smartdns</text>
<text x="1444" y="198" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">补包 · 写 13 条上游 · dnsmasq 让出 53</text>
<rect x="36" y="268" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#7b4fd0" stroke-width="2"/>
<text x="54" y="298" font-size="18" font-weight="700" fill="#7b4fd0" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">02</text>
<text x="88" y="298" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">INSTALL</text>
<rect x="1312" y="280" width="132" height="26" rx="6" fill="#7b4fd0"/>
<text x="1378" y="299" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅱ</text>
<text x="88" y="324" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">安装容器：迁移校验镜像 / 解压 rootfs / 写 config</text>
<text x="88" y="348" font-size="15" fill="#7b4fd0" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">img_migrate · rootfs · ct_config</text>
<text x="1444" y="348" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">rootfs 解压到 LXC_PATH</text>
<rect x="36" y="388" width="1428" height="106" rx="10" fill="#fbfcff" stroke="#7b4fd0" stroke-width="2"/>
<text x="54" y="418" font-size="18" font-weight="700" fill="#7b4fd0" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">03</text>
<text x="88" y="418" font-size="20" font-weight="700" fill="#111111" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">PREP</text>
