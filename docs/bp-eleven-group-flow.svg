<text x="1378" y="1139" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">Ⅳ</text>
<text x="88" y="1164" font-size="16" fill="#333333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">只验不装：网络通不通 / 组件就位没</text>
<text x="88" y="1188" font-size="15" fill="#e67e22" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">deps</text>
<text x="1444" y="1164" text-anchor="end" font-size="14" fill="#888888" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">前置：BOUNCERVERIFY</text>
<text x="1444" y="1188" text-anchor="end" font-size="14" fill="#555555" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">未就绪则 enroll 跳过</text>
